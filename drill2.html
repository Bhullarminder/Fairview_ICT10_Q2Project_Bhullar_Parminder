    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                Campus ICT 10
            </a>

            <div>
                <a href="index.html" class="btn btn-outline-light btn-sm">
                    Home
                </a>

                <a href="Skillstest.html" class="btn btn-outline-light btn-sm">

                <a href="drill2.html" class="btn btn-outline-light btn-sm">

                <a href="creator.html" class="btn btn-outline-light btn-sm">
                    Meet the Creator
                </a>
            </div>

        </div>
    </nav>


    <!-- Drill 2 -->
    <main class="container mt-5">

        <div class="text-center mb-5">
            <h1>School Club Members</h1>
            <p class="lead">
                Drill 2 - ICT Club Membership
            </p>
        </div>


        <div class="card shadow mx-auto" style="max-width: 600px;">

            <div class="card-header bg-dark text-white text-center">
                <h3 class="mb-0">ICT Club Membership</h3>
                <small>Add a new member</small>
            </div>

            <div class="card-body">

                <p class="text-center">
                    Enter your name to add yourself to the ICT Club list.
                </p>

                <label for="firstName" class="form-label">
                    First Name:
                </label>

                <input type="text" id="firstName" class="form-control"
                    placeholder="Enter first name">

                <br>

                <label for="lastName" class="form-label">
                    Last Name:
                </label>

                <input type="text" id="lastName" class="form-control"
                    placeholder="Enter last name">

                <br>

                <div class="text-center">
                    <button py-click="add_members" class="btn btn-dark">
                        Add Member
                    </button>
                </div>

                <div id="result" class="alert alert-secondary mt-4">
                    Member list will appear here.
                </div>

            </div>
        </div>

    </main>


    <!-- Footer -->
    <footer class="bg-dark text-white text-center mt-5 p-3">

        <p class="mb-0">
            Campus ICT 10 • Student Showcase 2026
        </p>

    </footer>


    <!-- Drill 2 Python -->
